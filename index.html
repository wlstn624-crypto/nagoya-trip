<script>

 if(k===d.steps.length-1){const t=d.cost.reduce((a,c)=>a+c[1],0);h+=det(`💴 오늘 비용 · ¥${t.toLocaleString()}`,d.cost.map(c=>`<div class="cr"><span>${c[0]}</span><span>¥${c[1].toLocaleString()}</span></div>`).join('')+`<div class="cr t"><span>합계 (2인)</span><span>약 ${won(t).toLocaleString()}원</span></div>`)}
 h+=`</article>`;

<div class="lbl" style="margin-top:12px">사전 결제 (원화)</div>${D.pre.map(p=>`<div class="cr"><span>${p[0]}</span><span>${p[1]}</span></div>`).join('')}</div>

document.querySelectorAll('.chk input').forEach(c=>{const k='nagoya_pack_'+c.dataset.k;c.checked=localStorage.getItem(k)==='1';c.onchange=()=>localStorage.setItem(k,c.checked?'1':'0')});
const sn=()=>document.documentElement.style.setProperty('--navh',$('nav').offsetHeight+'px');sn();addEventListener('resize',sn);
let me=null,acc=null,wid=null,fix=null;
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)};
$('loc').onclick=e=>{e.stopPropagation();
 if(!navigator.geolocation){toast('이 기기에서는 위치를 쓸 수 없어요');return}
 if(fix){map.flyTo(fix,16,{duration:.6});return}
 if(wid!==null)return;toast('위치 찾는 중…');let first=true;
 wid=navigator.geolocation.watchPosition(p=>{fix=[p.coords.latitude,p.coords.longitude];$('loc').classList.add('on');
  if(!me){me=L.marker(fix,{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:2000,interactive:false}).addTo(map);acc=L.circle(fix,{radius:p.coords.accuracy,color:'#2F7BF6',weight:1,fillOpacity:.12,interactive:false}).addTo(map)}
  else{me.setLatLng(fix);acc.setLatLng(fix).setRadius(p.coords.accuracy)}
  if(first){first=false;$('toast').style.display='none';map.flyTo(fix,16,{duration:.6})}},
 er=>{navigator.geolocation.clearWatch(wid);wid=null;toast(er.code===1?'위치 권한이 거부됐어요. 설정에서 허용해 주세요':'현재 위치를 찾지 못했어요')},
 {enableHighAccuracy:true,maximumAge:5000,timeout:20000})};
setDay(0);
